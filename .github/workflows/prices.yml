name: price bot
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay or skip busy slots)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pricebot/price_check.py
        if: env.SERPAPI_KEY != ''
        env:
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
