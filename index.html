<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub</title>
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- design tokens ---------- */
:root{
  --bg:#f6f7fb; --bg2:#eef0f6; --card:#ffffff; --text:#0f172a; --text2:#334155; --muted:#64748b; --line:#e8eaf1; --line2:#d9dce6;
  --accent:#6366f1; --accent-2:#8b5cf6; --accent-ink:#ffffff; --accent-soft:rgba(99,102,241,.12); --accent-glow:rgba(99,102,241,.35);
  --ok:#22c55e; --ok-soft:rgba(34,197,94,.14); --warn:#f59e0b; --warn-soft:rgba(245,158,11,.16); --bad:#ef4444; --bad-soft:rgba(239,68,68,.12);
  --ring-bg:#e8eaf1; --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.14); --shadow-lg:0 20px 50px -20px rgba(15,23,42,.35);
  --r:18px; --r-sm:12px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.22,1.3,.36,1);
  --sidebar:240px;
}
:root[data-theme="dark"]{
  --bg:#0b0d14; --bg2:#10131c; --card:#151823; --text:#e8eaf2; --text2:#c3c8d6; --muted:#8b90a3; --line:#232736; --line2:#2f3447;
  --ring-bg:#232736; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
  --accent-soft:rgba(129,140,248,.16); --ok-soft:rgba(34,197,94,.18); --warn-soft:rgba(245,158,11,.2); --bad-soft:rgba(239,68,68,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d14; --bg2:#10131c; --card:#151823; --text:#e8eaf2; --text2:#c3c8d6; --muted:#8b90a3; --line:#232736; --line2:#2f3447;
    --ring-bg:#232736; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
    --accent-soft:rgba(129,140,248,.16); --ok-soft:rgba(34,197,94,.18); --warn-soft:rgba(245,158,11,.2); --bad-soft:rgba(239,68,68,.18);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.01em}
::selection{background:var(--accent-soft)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:500;transition:transform .12s var(--ease),background .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 16px -6px var(--accent-glow)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:8px 10px}
.btn.ghost:hover{color:var(--text);background:var(--accent-soft);box-shadow:none}
.btn.danger{color:var(--bad)} .btn.danger:hover{background:var(--bad-soft);border-color:transparent;box-shadow:none}
.btn.icon{padding:8px;border-radius:10px}
.btn svg,.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.field{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:12px 0 5px}
.in,select,textarea{border:1px solid var(--line2);background:var(--bg);border-radius:12px;padding:10px 12px;width:100%;transition:border-color .2s,box-shadow .2s;outline:none}
.in:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:60px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.sp{flex:1}
.muted{color:var(--muted)}.small{font-size:12.5px}.b{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);letter-spacing:.01em}
.chip.work{background:var(--warn-soft);color:#b45309}.chip.ok{background:var(--ok-soft);color:#15803d}.chip.bad{background:var(--bad-soft);color:#b91c1c}.chip.grey{background:var(--bg2);color:var(--muted)}
:root[data-theme="dark"] .chip.work,:root:not([data-theme="light"]) .chip.work{color:#fbbf24}
:root[data-theme="dark"] .chip.ok,:root:not([data-theme="light"]) .chip.ok{color:#4ade80}
:root[data-theme="dark"] .chip.bad,:root:not([data-theme="light"]) .chip.bad{color:#f87171}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .chip.work{color:#b45309}:root:not([data-theme="dark"]) .chip.ok{color:#15803d}:root:not([data-theme="dark"]) .chip.bad{color:#b91c1c}}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.content{flex:1;min-width:0;padding:16px 16px calc(84px + env(safe-area-inset-bottom));max-width:1080px;margin:0 auto;width:100%}
.view{animation:viewIn .32s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) 0 14px}
.topbar h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:1px}
/* bottom tab bar (mobile) */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);display:flex;padding:6px;isolation:isolate}
.tabbar a{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;font-size:10.5px;font-weight:600;color:var(--muted);border-radius:16px;transition:color .25s}
.tabbar a .ic{width:22px;height:22px;transition:transform .35s var(--spring)}
.tabbar a.on{color:var(--accent)} .tabbar a.on .ic{transform:translateY(-1px) scale(1.08)}
.tabbar .ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:16px;background:var(--accent-soft);transition:transform .4s var(--spring),width .3s var(--ease);z-index:0}
@media (min-width:900px){
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;width:var(--sidebar);flex:none;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--bg2)}
  .side .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;font-weight:800;font-size:19px;letter-spacing:-.02em}
  .side .brand img{width:30px;height:30px;border-radius:9px;box-shadow:0 4px 10px -4px var(--accent-glow)}
  .side nav{display:flex;flex-direction:column;gap:2px;position:relative}
  .side nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--text2);font-weight:500;transition:background .2s,color .2s,transform .2s var(--ease);position:relative;z-index:1}
  .side nav a:hover{background:var(--accent-soft);transform:translateX(2px)}
  .side nav a.on{color:var(--accent);font-weight:600}
  .side nav .ind{position:absolute;left:0;right:0;height:42px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);transition:transform .4s var(--spring);z-index:0}
  .side .foot{margin-top:auto;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
  .content{padding:28px 36px 48px}
  .topbar{padding-top:0}
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;transition:background .3s}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}.dot.bad{background:var(--bad)}.dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}

/* ---------- cards + grid ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
section{margin-bottom:26px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:17px;font-weight:700}
.sec-h .n{font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.sq{aspect-ratio:1;display:flex;flex-direction:column;cursor:pointer;position:relative;overflow:hidden;padding:16px;animation:cardIn .5s var(--spring) both;animation-delay:calc(var(--i,0)*45ms);transition:transform .25s var(--spring),box-shadow .25s,border-color .25s;--lc:var(--accent)}
.sq:hover{transform:translateY(-3px);box-shadow:0 14px 30px -14px color-mix(in srgb,var(--lc) 45%,transparent);border-color:color-mix(in srgb,var(--lc) 40%,var(--line))}
.sq:active{transform:scale(.98)}
.sq::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--lc);opacity:.9}
.sq .emoji{font-size:22px;line-height:1;margin-bottom:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:color-mix(in srgb,var(--lc) 14%,transparent)}
.sq h3{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.sq .mini{font-size:12.5px;color:var(--muted);overflow:hidden;flex:1;line-height:1.5;-webkit-mask-image:linear-gradient(#000 calc(100% - 14px),transparent);mask-image:linear-gradient(#000 calc(100% - 14px),transparent)}
@media (max-width:600px){.sq{padding:13px}.sq .emoji{width:30px;height:30px;font-size:17px;margin-bottom:6px;border-radius:9px}.sq h3{font-size:14px}.sq .mini{font-size:12px}.sq .foot .ring{width:46px;height:46px}}
.sq .mini div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.sq .mini div::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid var(--line2);flex:none}
.sq .foot{display:flex;align-items:flex-end;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.sq.add{align-items:center;justify-content:center;color:var(--muted);border:2px dashed var(--line2);background:transparent;box-shadow:none;font-weight:600;gap:6px}
.sq.add::before{display:none}
.sq.add:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.sq.add .ic{width:26px;height:26px}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.ring{display:block}
.ring .bg{stroke:var(--ring-bg)} .ring .fg{stroke:var(--lc,var(--accent));transition:stroke-dashoffset .9s var(--ease),stroke .4s}
.ring.full .fg{stroke:var(--ok)}
.ring text{fill:var(--text);font-weight:700;font-size:12.5px}
.ring.lg text{font-size:18px}

/* hero */
.hero{display:flex;align-items:center;gap:18px;padding:22px;border-radius:var(--r);background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 18px 40px -18px var(--accent-glow);position:relative;overflow:hidden;margin-bottom:26px}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12);right:-70px;top:-120px;animation:float 9s ease-in-out infinite}
.hero::before{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1);right:120px;bottom:-110px;animation:float 7s ease-in-out infinite reverse}
@keyframes float{50%{transform:translateY(12px)}}
.hero .greet{font-size:22px;font-weight:800;letter-spacing:-.02em}
.hero .date{opacity:.85;font-size:13.5px;margin-top:3px}
.hero .stat{display:flex;gap:18px;margin-top:12px;font-size:12.5px}
.hero .stat b{display:block;font-size:17px}
.hero .ring{position:relative;z-index:1;--lc:#fff}.hero .ring .bg{stroke:rgba(255,255,255,.28)}.hero .ring text{fill:#fff}
.hero .ring.full .fg{stroke:#fff}

/* ---------- checklist ---------- */
.list-h{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.list-h .emoji{font-size:26px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:color-mix(in srgb,var(--lc) 15%,transparent);cursor:pointer;transition:transform .2s var(--spring)}
.list-h .emoji:hover{transform:scale(1.08)}
.title-in{font-size:22px;font-weight:800;letter-spacing:-.02em;border:0;background:transparent;padding:4px 0;border-radius:0;border-bottom:2px solid transparent;width:100%;outline:none;transition:border-color .2s}
.title-in:focus{border-bottom-color:var(--accent)}
.items{margin-top:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);position:relative;transition:background .2s,transform .25s var(--ease);border-radius:10px}
.item:last-child{border-bottom:0}
.item:hover{background:var(--bg2)}
.item.in{animation:itemIn .35s var(--spring)}
@keyframes itemIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.item.dragging{background:var(--card);box-shadow:var(--shadow-lg);z-index:3;transition:none;transform:scale(1.02)}
.grip{color:var(--line2);cursor:grab;touch-action:none;padding:4px 2px;display:flex;opacity:0;transition:opacity .2s}
.item:hover .grip{opacity:1}
@media (hover:none){.grip{opacity:.7}}
.grip:active{cursor:grabbing}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);background:transparent;padding:0;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:background .25s,border-color .25s,transform .3s var(--spring)}
.chk svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chk svg path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s var(--ease) .05s}
.chk:hover{border-color:var(--lc,var(--accent));transform:scale(1.1)}
.chk[aria-checked="true"]{background:var(--lc,var(--accent));border-color:var(--lc,var(--accent));animation:pop .4s var(--spring)}
.chk[aria-checked="true"] svg path{stroke-dashoffset:0}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.item{cursor:pointer;user-select:none;-webkit-user-select:none}
.txt{flex:0 1 auto;min-width:0;max-width:100%;outline:none;padding:3px 10px;margin-left:-6px;border-radius:8px;position:relative;word-break:break-word;transition:color .3s,background .2s;cursor:text;user-select:text;-webkit-user-select:text}
.txt:hover{background:var(--accent-soft)}
.txt:focus{background:var(--card);box-shadow:0 0 0 2px var(--accent-soft)}
.txt::after{content:"";position:absolute;left:10px;top:50%;height:1.5px;width:0;background:var(--muted);transition:width .35s var(--ease)}
.item .fill{flex:1;align-self:stretch;min-height:24px}
.item.done .txt{color:var(--muted)} .item.done .txt::after{width:calc(100% - 20px)}
.item .x{opacity:0;border:0;background:none;color:var(--muted);padding:4px;border-radius:8px;cursor:pointer;display:flex;transition:opacity .2s,background .2s,color .2s}
.item:hover .x,.item:focus-within .x{opacity:1}
.item .x:hover{background:var(--bad-soft);color:var(--bad)}
@media (hover:none){.item .x{opacity:.6}}
.addrow{display:flex;gap:8px;margin-top:12px;align-items:center}
.addrow .in{flex:1}
@media (max-width:640px){.addrow.wishadd{flex-wrap:wrap}.addrow.wishadd .in:first-child{flex:1 1 100%}.addrow.wishadd .in[type=date]{flex:1}}
.collapse{overflow:hidden;transition:height .3s var(--ease),opacity .25s,margin .3s,padding .3s}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:14px}
.empty .ill{width:72px;height:72px;margin:0 auto 10px;opacity:.6}
.empty .ill svg{width:100%;height:100%;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- wishlist ---------- */
.wish{padding:12px 6px;border-bottom:1px solid var(--line);transition:background .2s;border-radius:10px}
.wish:last-child{border-bottom:0}.wish:hover{background:var(--bg2)}
.wish.in{animation:itemIn .35s var(--spring)}
.wish .head{display:flex;align-items:center;gap:10px}
.wish .name{flex:1;font-weight:600;cursor:pointer;min-width:0;position:relative;transition:color .3s}
.wish .name::after{content:"";position:absolute;left:0;top:50%;height:1.5px;width:0;background:var(--muted);transition:width .35s var(--ease)}
.wish.done .name{color:var(--muted)}.wish.done .name::after{width:100%}
.wish .meta{font-size:12.5px;color:var(--muted);margin:5px 0 0 34px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.price{font-weight:700;font-size:13px;padding:4px 10px;border-radius:10px;background:var(--ok-soft);color:#15803d;white-space:nowrap}
.price.over{background:var(--warn-soft);color:#b45309}
:root[data-theme="dark"] .price,:root:not([data-theme="light"]) .price{color:#4ade80}
:root[data-theme="dark"] .price.over,:root:not([data-theme="light"]) .price.over{color:#fbbf24}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .price{color:#15803d}:root:not([data-theme="dark"]) .price.over{color:#b45309}}
.offers{margin:10px 0 2px 34px;font-size:13px;animation:itemIn .3s var(--ease);overflow-x:auto}
@media (max-width:640px){.offers{margin-left:0}.wish .meta{margin-left:0}}
.offers table{border-collapse:collapse;width:100%}
.offers td,.offers th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:12.5px}
.offers th{color:var(--muted);font-weight:500}
.offers tr.best td{font-weight:600}
.offers tr.best td:first-child::before{content:"★ ";color:var(--warn)}
.bar{height:6px;border-radius:99px;background:var(--ring-bg);overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);width:0;transition:width .8s var(--ease)}
.bar i.over{background:var(--warn)}

/* ---------- calendar ---------- */
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.cal-h h2{font-size:18px;font-weight:800;min-width:170px;text-align:center}
.cal-wrap{overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal.l{animation:slideL .35s var(--ease)}.cal.r{animation:slideR .35s var(--ease)}
@keyframes slideL{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.cal .dow{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.cal .day{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:72px;padding:6px 7px;font-size:12px;cursor:pointer;overflow:hidden;transition:transform .2s var(--spring),box-shadow .2s,border-color .2s;display:flex;flex-direction:column;gap:2px}
.cal .day:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.cal .day.dim{opacity:.38}
.cal .day .n{font-weight:600;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:2px}
.cal .day.today .n{background:var(--accent);color:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.cal .day.wk{background:var(--bg2)}
.cal .ev{font-size:10.5px;font-weight:500;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.work{background:var(--warn-soft);color:#b45309}

/* ---------- store: local docs + Supabase sync ----------

const DB = { docs: lsGet("docs", {}), pending: new Set(lsGet("pending", [])), cursor: lsGet("cursor", null) };

const get = id => { const d = DB.docs[id]; return d && !d.data.deleted ? d.data : null; };

}

  const r = await fetch(c.url.replace(/\/+$/, "") + "/rest/v1/" + path, { ...opt, headers });

}

    let changed = false;
    for (const row of rows) {

      if (DB.pending.has(row.id)) continue;

      if (cur && JSON.stringify(cur.data) === JSON.stringify(row.data)) continue;

    <circle class="bg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${w}" fill="none"/>
    <circle class="fg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-target="${c * (1 - pct)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>

  return `${topbar("Settings")}<div class="settings">
  <div class="card"><h3>You</h3><label class="field">Name (for the greeting)</label><input class="in" id="pName" value="${esc(p.name || "")}" placeholder="Andrew">
    <label class="field">Accent</label><div class="swatches">${Object.entries(ACCENTS).map(([k, [a]]) => `<div class="sw${(p.accent || "indigo") === k ? " on" : ""}" style="background:${a}" data-accent="${k}" title="${k}"></div>`).join("")}</div>
    <label class="field">Theme</label><div class="seg">${["system", "light", "dark"].map(t => `<button class="${theme === t ? "on" : ""}" data-act="theme" data-v="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="savePref">Save</button></div></div>
  <div class="card"><h3>Sync between devices</h3><p class="small muted" style="margin:2px 0 4px">Your own Supabase project (free). Run <code>supabase/setup.sql</code> once, then enter the values here on each device. <span class="row" style="display:inline-flex;gap:6px"><span class="dot" id="syncDot2"></span><span id="syncStatus">${esc(SYNC.msg)}</span></span></p>
    <label class="field">Project URL</label><input class="in" id="sUrl" value="${esc(c.url || "")}" placeholder="https://xxxx.supabase.co">
    <label class="field">Anon key</label><input class="in" id="sKey" value="${esc(c.key || "")}" placeholder="eyJ…">
    <label class="field">Secret word (the one in setup.sql)</label><input class="in" id="sSecret" type="password" value="${esc(c.secret || "")}">
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="connect">${SYNC.cfg ? "Reconnect" : "Connect"}</button>${SYNC.cfg ? '<button class="btn ghost danger" data-act="disconnect">Disconnect</button>' : ""}</div></div>
  <div class="card"><h3>Reminders</h3><p class="small muted" style="margin:2px 0 8px">Status: <b>${window.Notification ? Notification.permission : "not supported here"}</b>. On iPhone, notifications only work after adding Hub to the home screen.</p>
    <div class="row"><button class="btn" data-act="notifOn">${I.bell} Enable notifications</button><button class="btn ghost" data-act="notifTest">Test</button></div></div>
  <div class="card"><h3>Price bot</h3><p class="small muted" style="margin:2px 0 4px">A script (<code>pricebot/price_check.py</code>) runs on a schedule, reads the wishlist from Supabase and writes the cheapest trusted offers back. These settings are read by the bot.${meta?.ran_at ? " Last run " + new Date(meta.ran_at).toLocaleString() + "." : ""}</p>
    <div class="two"><div><label class="field">Sales tax rate (%)</label><input class="in" id="pbTax" type="number" step="0.01" value="${pb.tax_pct ?? 7.5}"></div><div><label class="field">Re-check each item every (minutes)</label><input class="in" id="pbMin" type="number" min="15" step="15" value="${pb.recheck_minutes ?? (pb.recheck_days ? pb.recheck_days * 1440 : 1440)}"></div></div>
    <div class="two"><div><label class="field">Monthly search budget</label><input class="in" id="pbBudget" type="number" min="1" value="${pb.monthly_budget ?? 95}"></div><div><label class="field">Searches per run</label><input class="in" id="pbPerRun" type="number" min="1" value="${pb.max_per_run ?? 3}"></div></div>
    <p class="small muted" style="margin:8px 0 0">The bot wakes every 15 minutes. Each item is searched again only after the re-check interval, and the bot stops for the month once the budget is used (SerpApi free tier = 100 searches a month).${meta?.month_used != null ? ` Used this month: <b>${meta.month_used}</b>.` : ""}</p>
    <label class="field">Trusted stores (one per line)</label><textarea id="pbStores" rows="5">${esc((pb.stores || DEFAULT_STORES).join("\n"))}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="savePb">Save</button></div></div>
  <div class="card"><h3>Data</h3><div class="row wrap" style="margin-top:8px"><button class="btn" data-act="export">${I.down} Export JSON</button><button class="btn" data-act="import">Import JSON</button><button class="btn ghost danger" data-act="wipe">Wipe this device</button></div>
    <p class="small muted" style="margin:12px 0 0">Hub v${APP_VERSION} · ${/iPhone|iPad/.test(navigator.userAgent) ? "iOS" : navigator.platform} · ${matchMedia("(display-mode: standalone)").matches ? "installed app" : "browser tab"}<br><details><summary>Changelog</summary>${CHANGELOG.map(l => `<div>${esc(l)}</div>`).join("")}</details></p></div></div>`;
};
const DEFAULT_STORES = ["Amazon.com", "Walmart", "Target", "Best Buy", "Costco", "Home Depot", "Lowe's", "B&H Photo", "Newegg", "Micro Center", "REI", "Dick's Sporting Goods", "Apple", "Staples", "Office Depot", "Kohl's", "Macy's", "Nike", "Adidas", "GameStop", "Chewy", "Petco", "Sam's Club", "Academy Sports", "Backcountry"];

/* ---------- router + render ---------- */
const TABS = [["dash", "Home", I.grid], ["wish", "Wishlist", I.cart], ["cal", "Calendar", I.cal], ["settings", "Settings", I.cog]];
function buildNav() {
  const html = TABS.map(([k, t, ic]) => `<a href="#${k}" data-t="${k}">${ic}<span>${t}</span></a>`).join("");
  $("#sideNav").insertAdjacentHTML("beforeend", html); $("#tabbar").insertAdjacentHTML("beforeend", html);
}
function route() { const h = location.hash.replace(/^#/, "") || "dash"; const [name, ...rest] = h.split("/"); return { name: V[name] && name !== "lists" ? name : "dash", arg: rest.join("/") }; }
function moveInd() {
  const { name } = route(), tab = name === "list" ? "dash" : name;
  for (const nav of [$("#sideNav"), $("#tabbar")]) {
    const a = $(`a[data-t="${tab}"]`, nav), ind = $(".ind", nav); if (!a) continue;
    if (nav.id === "tabbar") { ind.style.width = a.offsetWidth + "px"; ind.style.transform = `translateX(${a.offsetLeft}px)`; }
    else ind.style.transform = `translateY(${a.offsetTop}px)`;
  }
}
let lastView = null;
function render() {
  const { name, arg } = route(), tab = name === "list" ? "dash" : name;
  $$("#sideNav a,#tabbar a").forEach(a => a.classList.toggle("on", a.dataset.t === tab));
  const main = $("#view");
  const addIn = $(".addrow input.in", main), keepAdd = addIn && document.activeElement === addIn ? addIn.value : null;
  main.innerHTML = V[name](arg);
  if (lastView !== name + "/" + arg) { main.classList.remove("view"); main.offsetHeight; main.classList.add("view"); }
  lastView = name + "/" + arg;
  if (keepAdd != null) { const i = $(".addrow input.in", main); if (i) { i.value = keepAdd; i.focus(); } }
  animateRings(main); requestAnimationFrame(() => $$(".bar i[data-w]", main).forEach(i => i.style.width = i.dataset.w + "%"));
  if (name === "list") dragInit($("#items"), (from, to) => patch("list:" + arg, l => { const [it] = l.items.splice(from, 1); l.items.splice(to, 0, it); }, { quiet: true }));
  const desk = matchMedia("(min-width:900px)").matches;
  if (name === "cal" && desk) $("#newEvDesk").style.display = "";
  $("#fabWrap").innerHTML = name === "cal" && !desk ? `<button class="fab" data-act="newEvent" title="New event">${I.plus}</button>` : "";
  moveInd();
}
addEventListener("hashchange", render);
addEventListener("resize", moveInd);

/* ---------- drag to reorder ---------- */
function dragInit(container, onDrop) {
  if (!container) return;
  container.addEventListener("pointerdown", e => {
    const grip = e.target.closest(".grip"); if (!grip) return;
    const row = grip.closest(".item"), rows = $$(".item", container), from = rows.indexOf(row), h = row.offsetHeight + 0;
    e.preventDefault(); row.setPointerCapture(e.pointerId); row.classList.add("dragging");
    const y0 = e.clientY; let to = from;
    const move = ev => {
      const dy = ev.clientY - y0; row.style.transform = `translateY(${dy}px) scale(1.02)`;
      to = Math.max(0, Math.min(rows.length - 1, from + Math.round(dy / h)));
      rows.forEach((r, i) => { if (r === row) return; let s = 0; if (from < to && i > from && i <= to) s = -h; else if (from > to && i >= to && i < from) s = h; r.style.transform = s ? `translateY(${s}px)` : ""; });
    };
    const up = () => {
      row.removeEventListener("pointermove", move); row.removeEventListener("pointerup", up); row.removeEventListener("pointercancel", up);
      row.classList.remove("dragging"); rows.forEach(r => r.style.transform = "");
      if (to !== from) { if (to > from) rows[to].after(row); else rows[to].before(row); onDrop(from, to); }
    };
    row.addEventListener("pointermove", move); row.addEventListener("pointerup", up); row.addEventListener("pointercancel", up);
  });
}

/* ---------- event handling (delegated) ---------- */
document.addEventListener("click", async e => {
  let t = e.target.closest("[data-act]"), act = t?.dataset.act; const { arg } = route();
  if (!act && e.target.closest(".item") && !e.target.closest(".txt,.grip,.x")) { t = $(".chk", e.target.closest(".item")); act = "tick"; }
  if (act === "toggleTheme") { const cur = lsGet("theme", "system"), isDark = document.documentElement.dataset.theme === "dark" || (cur === "system" && matchMedia("(prefers-color-scheme: dark)").matches); lsSet("theme", isDark ? "light" : "dark"); applyTheme(); return; }
  if (!$("#view").contains(e.target) && !$("#fabWrap").contains(e.target)) return;
  if (act === "newlist") { const id = newList("New list"); location.hash = "#list/" + id.slice(5); setTimeout(() => { const i = $(".title-in"); i?.focus(); i?.select(); }, 60); return; }
  if (act === "editList") { listStyleForm("list:" + arg); return; }
  if (act === "delList") { const l = get("list:" + arg); if (await ask("Delete list?", `“${l.title}” and its ${l.items.length} items will be removed everywhere.`)) { del("list:" + arg, { quiet: true }); location.hash = "#dash"; toast("List deleted"); } return; }
  if (act === "clearDone") { const rows = $$("#items .item.done"); if (!rows.length) return toast("Nothing to clear"); rows.forEach(r => collapse(r)); patch("list:" + arg, l => l.items = l.items.filter(i => !i.done), { quiet: true }); setTimeout(() => updateListHeader(get("list:" + arg)), 50); return; }
  if (act === "tick") {
    const row = t.closest("[data-item]"), iid = row.dataset.item, l = get("list:" + arg), it = l.items.find(i => i.id === iid); if (!it) return;
    it.done = !it.done; it.doneAt = it.done ? Date.now() : null; put("list:" + arg, l, { quiet: true });
    row.classList.toggle("done", it.done); t.setAttribute("aria-checked", it.done); updateListHeader(l);
    const { t: tot, d } = listStats(l); if (it.done && tot && d === tot) { const r = $("#view .list-h .ring").getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2); toast("🎉 All done!"); }
    return;
  }
  if (act === "delItem") { const row = t.closest("[data-item]"), iid = row.dataset.item; collapse(row); patch("list:" + arg, l => l.items = l.items.filter(i => i.id !== iid), { quiet: true }); updateListHeader(get("list:" + arg)); return; }
  if (act === "wtick") {
    const row = t.closest("[data-wish]"), id = row.dataset.wish, w = get(id); if (!w) return;
    w.done = !w.done; w.doneAt = w.done ? Date.now() : null; put(id, w, { quiet: true });
    row.classList.toggle("done", w.done); t.setAttribute("aria-checked", w.done); updateWishHeader();
    if (w.done) { const r = t.getBoundingClientRect(); confetti(r.left + 12, r.top + 12, ["#f59e0b", "#22c55e", "#3b82f6"]); }
    return;
  }
  if (act === "wopen") { const id = t.closest("[data-wish]").dataset.wish, o = lsGet("wopen", {}); o[id] = !o[id]; lsSet("wopen", o); render(); return; }
  if (act === "wedit") { const id = t.closest("[data-wish]").dataset.wish; wishForm({ id, ...get(id) }); return; }
  if (act === "calPrev") { calMove(-1); return; }
  if (act === "calNext") { calMove(1); return; }
  if (act === "calToday") { CAL.anchor = today(); CAL.dir = ""; render(); return; }
  if (act === "managePresets") { presetsSheet(); return; }
  if (act === "disarm") { CAL.armed = null; render(); return; }
  const pch = e.target.closest("[data-preset]"); if (pch) { CAL.armed = CAL.armed === pch.dataset.preset ? null : pch.dataset.preset; render(); return; }
  const vb = e.target.closest("[data-view]"); if (vb) { setView(vb.dataset.view); return; }
  const dh = e.target.closest("[data-dayhead]"); if (dh) { setView("day", dh.dataset.dayhead); return; }
  const ymt = e.target.closest("[data-ym]"); if (ymt) { setView("month", ymt.dataset.ym + "-01"); return; }
  if (act === "newEvent") { eventForm({}); return; }
  if (act === "ics") { icsAll(); return; }
  if (act === "connect") { const cfg = { url: $("#sUrl").value.trim(), key: $("#sKey").value.trim(), secret: $("#sSecret").value.trim() }; if (!cfg.url || !cfg.key || !cfg.secret) return toast("Fill in all three values"); connect(cfg).then(ok => { toast(ok ? "Connected ✓" : "Could not connect: " + SYNC.msg, 5000); render(); }); return; }
  if (act === "disconnect") { disconnect(); render(); return; }
  if (act === "notifOn") { if (!window.Notification) return toast("Not supported in this browser"); Notification.requestPermission().then(p => { toast("Notifications " + p); render(); }); return; }
  if (act === "notifTest") { if (Notification?.permission !== "granted") return toast("Enable them first"); try { new Notification("Hub", { body: "Reminders work here." }); } catch { navigator.serviceWorker?.ready.then(r => r.showNotification("Hub", { body: "Reminders work here." })); } return; }
  if (act === "savePb") { put("settings:pricebot", { tax_pct: Number($("#pbTax").value) || 0, recheck_minutes: Math.max(15, Number($("#pbMin").value) || 1440), monthly_budget: Math.max(1, Number($("#pbBudget").value) || 95), max_per_run: Math.max(1, Number($("#pbPerRun").value) || 3), stores: $("#pbStores").value.split("\n").map(s => s.trim()).filter(Boolean) }); toast("Saved"); return; }
  if (act === "savePref") { lsSet("pref", { ...PREF(), name: $("#pName").value.trim() }); applyTheme(); toast("Saved"); return; }
  if (act === "theme") { lsSet("theme", t.dataset.v); applyTheme(); render(); return; }
  if (act === "export") { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({ version: APP_VERSION, docs: DB.docs }, null, 1)], { type: "application/json" })); a.download = "hub-" + today() + ".json"; a.click(); return; }
  if (act === "import") { const i = document.createElement("input"); i.type = "file"; i.accept = ".json"; i.onchange = async () => { try { const j = JSON.parse(await i.files[0].text()); let n = 0; for (const [id, d] of Object.entries(j.docs || {})) { put(id, d.data, { quiet: true }); n++; } render(); toast("Imported " + n + " records"); } catch (err) { toast("Import failed: " + err.message); } }; i.click(); return; }
  if (act === "wipe") { if (await ask("Wipe this device?", "Removes all Hub data from this browser. Synced data stays on the server.", "Wipe")) { localStorage.clear(); location.reload(); } return; }
  const acc = e.target.closest("[data-accent]"); if (acc) { lsSet("pref", { ...PREF(), accent: acc.dataset.accent }); applyTheme(); $$("[data-accent]").forEach(x => x.classList.toggle("on", x === acc)); return; }
  if (act) return;
  const evr = e.target.closest("[data-ev]"); if (evr) { eventForm({ id: evr.dataset.ev, ...get(evr.dataset.ev) }); return; }
  const day = e.target.closest("[data-day]"); if (day) { calDayClick(e, day); return; }
  const go = e.target.closest("[data-go]"); if (go) { location.hash = go.dataset.go; return; }
});
$("#view").addEventListener("change", e => {
  const { arg } = route(), t = e.target;
  if (t.dataset.act === "title") patch("list:" + arg, l => l.title = t.value.trim() || "Untitled", { quiet: true });
});
$("#view").addEventListener("focusout", e => {
  const t = e.target; if (t.dataset?.act !== "text") return;
  const iid = t.closest("[data-item]").dataset.item, v = t.textContent.trim();
  patch("list:" + route().arg, l => { const it = l.items.find(i => i.id === iid); if (it && v) it.text = v; }, { quiet: true });
  if (!v) t.textContent = get("list:" + route().arg)?.items.find(i => i.id === iid)?.text || "";
});
$("#view").addEventListener("submit", e => {
  e.preventDefault(); const f = e.target, inp = $("input", f), v = inp.value.trim(); if (!v) return;
  if (f.dataset.act === "addItem") {
    const it = { id: uid(), text: v, done: false, created: Date.now() };
    patch("list:" + route().arg, l => l.items.push(it), { quiet: true });
    $("#emptyItems")?.remove(); $("#items").insertAdjacentHTML("beforeend", itemRow(it)); $("#items").lastElementChild.classList.add("in");
    updateListHeader(get("list:" + route().arg)); inp.value = ""; inp.focus();
  }
  if (f.dataset.act === "addWish") {
    const by = $("input[type=date]", f)?.value || "", id = "wish:" + uid();
    put(id, { name: v, by, qty: 1, budget: "", note: "", done: false, created: Date.now() }, { quiet: true });
    render(); const row = $(`[data-wish="${id}"]`); row?.classList.add("in"); $(".addrow input.in", $("#view"))?.focus();
  }
});
$("#view").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset.act === "text") { e.preventDefault(); e.target.blur(); $(".addrow input")?.focus(); }
  if (e.key === "Enter" && e.target.dataset.act === "title") e.target.blur();
  if (e.key === "Escape" && e.target.dataset.act === "text") e.target.blur();
});
$("#view").addEventListener("paste", e => { if (e.target.dataset?.act === "text") { e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData.getData("text/plain") || "").replace(/\n+/g, " ")); } });
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea,[contenteditable]") || e.metaKey || e.ctrlKey || e.altKey) return;
  const map = { 1: "#dash", 2: "#wish", 3: "#cal", 4: "#settings" };
  if (map[e.key]) location.hash = map[e.key];
  if (e.key === "n" && route().name === "cal") eventForm({});
  if (route().name === "cal") { const vm = { m: "month", w: "week", d: "day", y: "year" }; if (vm[e.key]) setView(vm[e.key]); if (e.key === "Escape" && CAL.armed) { CAL.armed = null; render(); } if (e.key === "ArrowLeft") calMove(-1); if (e.key === "ArrowRight") calMove(1); }
  if (e.key === "n" && route().name === "wish") wishForm({});
});
function dayModal(d) {
  const occ = occurrences(d, d);
  const b = sheet(`<h3>${fmtDate(d, { weekday: "long", month: "long", day: "numeric" })}</h3><div class="agenda" style="margin-top:6px">
    ${occ.length ? occ.map(({ ev, date }) => evRow(ev, date)).join("") : `<div class="muted small" style="padding:8px 0">Nothing on this day.</div>`}</div>
    <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn ghost" data-act="close">Close</button><button class="btn primary" data-act="add">${I.plus}Add event</button></div>`);
  b.addEventListener("click", e => {
    const ev = e.target.closest("[data-ev]"); if (ev) { b.remove(); eventForm({ id: ev.dataset.ev, ...get(ev.dataset.ev) }); return; }
    if (e.target.closest("[data-act=add]")) { b.remove(); eventForm({}, d); }
  });
}

/* ---------- boot ---------- */
function applyTheme() {
  const t = lsGet("theme", "system"); if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  const [a, a2] = ACCENTS[PREF().accent] || ACCENTS.indigo; const r = document.documentElement.style;
  r.setProperty("--accent", a); r.setProperty("--accent-2", a2); r.setProperty("--accent-soft", a + "1f"); r.setProperty("--accent-glow", a + "59");
  const isDark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  const tb = $("#themeBtn"); if (tb) tb.innerHTML = isDark ? I.sun : I.moon;
}
buildNav(); applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
if (!Object.keys(DB.docs).length && !SYNC.cfg) {
  put("list:" + uid(), { title: "Groceries", emoji: "🛒", color: "#22c55e", items: [{ id: uid(), text: "Eggs", done: false }, { id: uid(), text: "Milk", done: true }, { id: uid(), text: "Coffee", done: false }], created: Date.now(), order: 0 }, { quiet: true });
}
if (!SYNC.cfg) ensurePresets();
render(); checkReminders();
if (SYNC.cfg) { setSync("busy", "Connecting…"); pull().then(() => { ensurePresets(); return push(); }).then(startSyncLoop); }
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
window.hubdbg = () => ({ v: APP_VERSION, DB, SYNC });
}
